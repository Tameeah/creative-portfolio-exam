<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Page</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="page-transition-overlay"></div>
    <header>
        <div class="hero-section">
            <h1 class="logo-print">The Creative Portfolio</h1>
        </div>

        <div id="nav-placeholder"></div>
         
    </header>


    <main id="experience-page">
        <h2>My Experience Through The Years</h2>

        <div class="experience-grid">
            <div class="year-card" onclick="openProject(
                '2023 : The Sun ', 
                'In my matric year, all the students were given the opportunity to explore their art style,media and subjects. In 2023 I focused on creating a series of artworks based on the Earth,Sun and the Moon. This project was my favourite to work on during my June examination period. I was most proud of The Sun. This project explored my creative ability to layer various subject into one brilliant artwork. I wored with multiple media such as charcoal, acrylic paint, oil pastels and chalk. In 2023 I really went over my boundaries and brought colour into something beautfiul.',
                'image',
                '../Assets/Images/2023/The Sun B&W.jpg, ../Assets/Images/2023/The Sun Final.jpg, ../Assets/Images/2023/The Sun Multi.jpg'
                )">
                <h3>2023</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2024 : Vespa!', 
                'In my first year of being in Wits, for my final exam we were assigned to make a short comic book. This was my favourite project from the year and the one I worked on the most. While building board games, I was working on this comic book in 2024. This comic book was inspired by the Disney and Pixar animation,Luca. A boy who is wokring hard to buy himself a vespa to feel close to his father. I was determined to show motion in the stillness and rigidity of comic block layout and structure. The style of my line texture and character design was evident in my comic book, showing the different personalities and behaviours of the characters. Below you can view my three favourite pages from my comic book Vespa!.',
                'image',
                 '../Assets/Images/Drawings/comic - page 4.jpg,../Assets/Images/Drawings/Comic - page 5.jpg, ../Assets/Images/Drawings/comic - page 7.jpg'
                 )">
                <h3>2024</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2025 : Wandering Whiskers ',
                 'In 2025 Semester 1, I worked on a group assignment, to build a 2D game in Unity. This year was focused on learning the fundamentals of the software, while making our own assets for the video game. We built a Top-down, puzzle game for young girls playing as a kitten in their owners home. The kitten will explore the bedroom and come across mini-games to win in order to progress to the next room in the house. Our 2D game focused on movement, exploration,progression and mini-game systems. Mechanics included movement in the bedroom and the individual mini-game mechanics. Our 2D game was a group effort with my two memebers, Diyanah Amod and Nadirah Andrews. ',
                 'video',
                 '../Assets/videos/wandering whiskers clip.mp4'
                  )">
                <h3>2025-P1</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2025 : Farming Frenzy ',
                 'In 2025 Semester 2, I worked on another group assignment, to build a 3D game in Unity. This year was focused on taking what we learnt in semester 1 and broadening our skills into 3D fundamentals. We were instructed to create all of our own 3D assets using Blender. Me and my group memebers built a first-player shooter video game. The player will protect and defend their tomatoe farm against the pig intruders as the farmer character. The player explores their farm, picking up clues about the invasion that will take place on their farm, they are challenged to collect and protect their crops. Our 3D game was a group effort with my two members, Diyanah Amod and Thandolwethu Ggeno. The group worked on building our own assets and mechanics throughout the entire game.',
                 'video',
                 '../Assets/videos/Farming Frenzy clip.mp4'
                  )">
                <h3>2025-P2</h3>
            </div>    

            <div class="year-card" onclick="openProject(
                '2026 : Smack',
                 'While balancing my academic studies, this year I am a member of the upcoming cultural and creative collective, SMACK. We are a collaborative communicty/space who are aiming to bring art to the world as a creative brand not a product. This group is made up of seven female memebers who intend to take our skills and collaborator with other fellow artists geared towards Gen Z. We work on portfolios as individual artists, content for other artists and also just for the love of creating. We bring an authentic and organic South African culture to the table of art. We work with any type of media: short films, animations, web pages, artworks etc. Keeping our work consistent and balanced with our Wits academics we are working hard this year to group our brand over social media and through interaction in public.',
                 'image',
                  '../Assets/Images/Digital Artworks/Hirono Characters .png,../Assets/Images/Digital Artworks/Smack sticker.jpeg, ../Assets/Images/Digital Artworks/Tim beach illustration.png',
                  )">
                <h3>2026</h3>
            </div>
        </div>

        <div id="projectPopup" class="popup-overlay">
            <div class="popup-content">
                <span class="close-btn" onclick="closeProject()">&times;</span>
                <h1 id="popupTitle">Year</h1>
                <p id="popupOverview">Project details go here...</p>
                
                <div id="popupMedia" class="popup-media-container"></div>                
            </div>
        </div>
    </main>

    <script src="../app.js"></script>

  
    
</body>
</html>
