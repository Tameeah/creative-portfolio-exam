<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Page</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="page-transition-overlay"></div>
    <header>
        <div class="hero-section">
            <h1 class="logo-print">The Creative Portfolio</h1>
        </div>

        <div id="nav-placeholder"></div>
         
    </header>


    <main id="experience-page">
        <h2>Experience</h2>
        <h3>My Experience Through The Years</h3>


        <div class="experience-grid">
            <div class="year-card" onclick="openProject(
                '2023 : The Sun ', 
                'In my matric year, all the students were given the opportunity to explore their art style,media and subjects. In 2023 I focused on creating a series of artworks based on the Earth, the Sun and the Moon. The Sun was my favourite to work on during my June examination period. This project explored my creative ability to layer various subjects into one brilliant artwork. I worked with multiple media such as charcoal, acrylic paint, and oil pastels. In 2023 I broke my boundaries and brought colour into something beautfiul.',
                'image',
                '../Assets/Images/2023/The Sun B&W.jpg, ../Assets/Images/2023/The Sun Final.jpg, ../Assets/Images/2023/The Sun Multi.jpg'
                )">
                <h3>2023</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2024 : Vespa!', 
                'In my first year at Wits, my final exam was to make a short comic book. While building board games, I was working on this comic book. This comic book was inspired by the Disney and Pixar animation,Luca. A boy who is wokring hard to buy himself a vespa to feel close to his late father. I was determined to show motion in the stillness and rigidity of the comic block layout and structure. The style of my line texture and character design was evident in my comic book, showing the different personalities and behaviours of the characters. Below you can view my three favourite pages from my comic book Vespa!.',
                'image',
                 '../Assets/Images/Drawings/comic - page 4.jpg,../Assets/Images/Drawings/Comic - page 5.jpg, ../Assets/Images/Drawings/comic - page 7.jpg'
                 )">
                <h3>2024</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2025 : Wandering Whiskers ',
                 'In 2025 Semester 1, I worked on a group assignment, to build a 2D game in Unity. It was focused on learning the fundamentals of the software, while making our own assets for the video game. We built a Top-down, puzzle game for young girls playing as a kitten. The kitten will explore the bedroom and come across mini-games to overcome in order to progress to the next room in the house. Our 2D game focused on movement, exploration progression and mini-game systems. Mechanics included movement in the bedroom and the individual mini-game mechanics. Our 2D game was a group effort with my two memebers, Diyanah Amod and Nadirah Andrews. ',
                 'video',
                 '../Assets/videos/wandering whiskers clip.mp4'
                  )">
                <h3>2025-SM1</h3>
            </div>

            <div class="year-card" onclick="openProject(
                '2025 : Farming Frenzy ',
                 'In 2025 Semester 2, I worked on another group assignment, to build a 3D game in Unity. It was focused on taking what we learnt in Semester 1 and broadening our skills into 3D fundamentals. We were instructed to create all of our own 3D assets using Blender and unique mechanics on Unity. This is a First-Player Shooter video game. The player, as the farmer, will protect and defend their tomatoe farm against the pig intruders. The player explores their farm, picking up clues about the invasion that is taking place on their farm. Our 3D game was a group effort with my two members, Diyanah Amod and Thandolwethu Ggeno. ',
                 'video',
                 '../Assets/videos/Farming Frenzy clip.mp4'
                  )">
                <h3>2025-SM2</h3>
            </div>    

            <div class="year-card" onclick="openProject(
                '2026 : Smack',
                 'While balancing my academic studies, this year I am a founding member of the creative collective, SMACK. We are a collaborative space who are aiming to bring art to the world as a creative brand not a product. This group is made up of seven female memebers who intend to take our skills and collaborator with other fellow artists mainly geared towards Gen Z. We work on content for other artists and individual projects. We bring an authentic and organic South African culture to the table of art. We work with any type of media: short films, animations, web pages, artworks etc. Keeping our work consistent and balanced with our Wits academics we are working hard this year to group our brand over social media and through interaction in public.',
                 'image',
                  '../Assets/Images/Digital Artworks/Hirono Characters .png,../Assets/Images/Digital Artworks/Smack sticker.jpeg, ../Assets/Images/Digital Artworks/Tim beach illustration.png',
                  )">
                <h3>2026</h3>
            </div>
        </div>

        <div id="projectPopup" class="popup-overlay">
            <div class="popup-content">
                <span class="close-btn" onclick="closeProject()">&times;</span>
                <h1 id="popupTitle">Year</h1>
                <p id="popupOverview">Project details go here...</p>
                
                <div id="popupMedia" class="popup-media-container"></div>                
            </div>
        </div>
    </main>

    <script src="../app.js"></script>

  
    
</body>
</html>
