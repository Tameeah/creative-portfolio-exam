<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Creative Portfolio | Tameeah Padayachy </title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <header>
        <div class="hero-section">
            <h1 class="logo-print">The Creative Portfolio</h1>
        </div>

        <div id="nav-placeholder"></div>
         
    </header>

    <main id="homepage-content">
        <section class="intro-hero">
            <h2 class="artist-name">Tameeah Padayachy</h2>
            <p class="artist-description">Fill in an inspirational description</p>
        </section>

        <section class="art-gallery">
            <div class="card-grid">
                <div class="artwork-card" data-id="1">
                    <img src="./Assets/Images/Digital Artworks/Hirono Characters .png" alt="">
                </div>
                <div class="artwork-card" data-id="2">
                    <img src="./Assets/Images/Drawings/'Rays'.jpg" alt="">
                </div>
                <div class="artwork-card" data-id="3">
                    <video width="100%" height="auto" autoplay loop muted playsinline>
                        <source src="./Assets/Animations/Firework Animation.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="artwork-card" data-id="4">
                    <img src="./Assets/Images/Acrylic Paint/'Olivia Dean'.jpg" alt="">
                </div>
                <div class="artwork-card" data-id="5">
                    <img src="./Assets/Images/Digital Artworks/meant to be.png" alt="">
                </div>
                <div class="artwork-card" data-id="6">
                    <video width="100%" height="auto" autoplay loop muted playsinline>
                        <source src="./Assets/Animations/Smack Walk.mov" type="video/mp4">
                    </video>
                </div>
                <div class="artwork-card" data-id="7">
                    <img src="./Assets/Images/Acrylic Paint/'Big Boots'.jpg" alt="">
                </div>
                <div class="artwork-card" data-id="8">
                    <img src="./Assets/Images/Digital Artworks/Tim beach illustration.png" alt="">
                </div>
                <div class="artwork-card" data-id="9">
                    <img src="./Assets/Images/Mixed media/Contour.jpg" alt="">
                </div>
                <div class="artwork-card" data-id="10">
                    <video width="100%" height="auto" autoplay loop muted playsinline>
                        <source src="./Assets/Animations/Bouncing Ball.mp4" type="video/mp4">
                    </video>
                </div>

            </div>
        </section>
        
    </main>

    <script src="./app.js"></script>



</body>
</html>
